services:
  - type: web
    name: scviewer-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn scviewer_api.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCVIEWER_ALLOWED_ORIGINS
        value: https://savvasraptis.github.io
      - key: SCVIEWER_CACHE_DIR
        value: /var/data/scviewer-cache
      - key: SCVIEWER_HORIZONS_CHUNK_DAYS
        value: "31"
