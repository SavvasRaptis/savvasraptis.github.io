name: Sync SCViewer UI Release

on:
  workflow_dispatch:
    inputs:
      ui_repo:
        description: "GitHub repo with SCViewer UI release assets"
        required: true
        default: "SavvasRaptis/scviewer-ui"
        type: string
      release_tag:
        description: "Release tag in scviewer-ui (e.g. v1.0.0)"
        required: true
        type: string
      asset_name:
        description: "Release asset zip filename"
        required: true
        default: "scviewer-ui-dist.zip"
        type: string
      target_dir:
        description: "Published directory in this website repo"
        required: true
        default: "Spacecraft Location Viewer"
        type: string
  repository_dispatch:
    types: [scviewer_ui_release]

permissions:
  contents: write

jobs:
  sync-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: cfg
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "ui_repo=${{ github.event.client_payload.ui_repo }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ github.event.client_payload.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "asset_name=${{ github.event.client_payload.asset_name || 'scviewer-ui-dist.zip' }}" >> "$GITHUB_OUTPUT"
            echo "target_dir=${{ github.event.client_payload.target_dir || 'Spacecraft Location Viewer' }}" >> "$GITHUB_OUTPUT"
          else
            echo "ui_repo=${{ inputs.ui_repo }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "asset_name=${{ inputs.asset_name }}" >> "$GITHUB_OUTPUT"
            echo "target_dir=${{ inputs.target_dir }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download UI release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scviewer-ui-release
          gh release download "${{ steps.cfg.outputs.release_tag }}" \
            --repo "${{ steps.cfg.outputs.ui_repo }}" \
            --pattern "${{ steps.cfg.outputs.asset_name }}" \
            --dir /tmp/scviewer-ui-release

      - name: Unpack and sync into website path
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/scviewer-ui-release/${{ steps.cfg.outputs.asset_name }}"
          UNPACK="/tmp/scviewer-ui-unpacked"
          TARGET="${{ steps.cfg.outputs.target_dir }}"
          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          unzip -q "$ZIP" -d "$UNPACK"

          # Support either zip-root files or single top-level folder.
          SRC="$UNPACK"
          COUNT="$(find "$UNPACK" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          FILES_AT_ROOT="$(find "$UNPACK" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$COUNT" == "1" && "$FILES_AT_ROOT" == "0" ]]; then
            SRC="$(find "$UNPACK" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          mkdir -p "$TARGET"
          rsync -a --delete "$SRC"/ "$TARGET"/

          test -f "$TARGET/Heliospheric Locator.html"

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.cfg.outputs.target_dir }}"
          git commit -m "Sync SCViewer UI ${{ steps.cfg.outputs.release_tag }} into ${{ steps.cfg.outputs.target_dir }}"
          git push
