name: Build and Publish SCViewer UI Release Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-release-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scviewer-ui
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build UI (adjust to your actual build command)
        shell: bash
        run: |
          set -euo pipefail
          # Example:
          # npm ci
          # npm run build
          #
          # Expected output for packaging below:
          # dist/heliospheric-locator.html
          # dist/App.jsx
          # dist/Sidebar.jsx
          # dist/Inspector.jsx
          # dist/PlotPanel.jsx
          # dist/spacecraft.js
          # dist/plot.js
          # dist/models.js
          # dist/styles.css
          test -d dist
          test -f "dist/heliospheric-locator.html"

      - name: Create release zip
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r ../scviewer-ui-dist.zip .

      - name: Upload/replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" scviewer-ui-dist.zip --clobber

      - name: Notify website repo (optional auto-sync)
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_DISPATCH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WEBSITE_REPO_DISPATCH_PAT is not set; skipping website dispatch."
            exit 0
          fi
          gh api repos/SavvasRaptis/savvasraptis.github.io/dispatches \
            -f event_type='scviewer_ui_release' \
            -f client_payload[ui_repo]="${{ github.repository }}" \
            -f client_payload[release_tag]="${{ steps.tag.outputs.tag }}" \
            -f client_payload[asset_name]='scviewer-ui-dist.zip' \
            -f client_payload[target_dir]='scviewer-ui'
